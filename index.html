<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lute Light Reader</title>
  <meta name="theme-color" content="#18181b" />
  <meta name="description" content="Minimalist offline-first Lute PWA reader for language learners." />
  
  <!-- Web Application Manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- JSZip for standalone EPUB parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- React Dependencies -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .font-serif-reader {
      font-family: 'Merriweather', serif;
    }

    /* Word Status Color Tokens */
    .word-status-1 { background-color: rgba(254, 240, 138, 0.4); border-bottom: 2px solid #eab308; } /* New: Yellow */
    .word-status-2 { background-color: rgba(254, 215, 170, 0.4); border-bottom: 2px solid #f97316; } /* Learning 1: Orange */
    .word-status-3 { background-color: rgba(187, 247, 208, 0.4); border-bottom: 2px solid #22c55e; } /* Learning 2: Light Green */
    .word-status-4 { border-bottom: 1px dotted #9ca3af; }                                        /* Mastered: Clean */
    .word-status-99 { opacity: 0.55; }                                                          /* Ignored */

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen overflow-hidden flex flex-col transition-colors duration-200">
  <div id="root" class="h-full w-full flex flex-col flex-1"></div>

  <script type="text/babel">
    const APP_VERSION = 'v1.1.0';
    const DEFAULT_GITHUB_REPO = 'owner/repo'; // Change this to your repository (e.g., 'username/lute-app')

    const DB_NAME = 'LutePWA_DB';
    const DB_VERSION = 1;

    class LocalDB {
      constructor() {
        this.db = null;
        this.useFallback = false;
        this.memoryBooks = [];
        this.memoryWords = {};
        this.initPromise = null;
      }

      async ensureReady() {
        if (!this.initPromise) {
          this.initPromise = this.init();
        }
        return this.initPromise;
      }

      async init() {
        return new Promise((resolve) => {
          try {
            if (!window.indexedDB) {
              this.useFallback = true;
              return resolve(this);
            }

            const request = indexedDB.open(DB_NAME, DB_VERSION);
            
            request.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('books')) {
                const bookStore = db.createObjectStore('books', { keyPath: 'id' });
                bookStore.createIndex('addedAt', 'addedAt', { unique: false });
              }
              if (!db.objectStoreNames.contains('words')) {
                const wordStore = db.createObjectStore('words', { keyPath: 'text' });
                wordStore.createIndex('status', 'status', { unique: false });
              }
              if (!db.objectStoreNames.contains('settings')) {
                db.createObjectStore('settings', { keyPath: 'key' });
              }
            };

            request.onsuccess = (e) => {
              this.db = e.target.result;
              resolve(this);
            };

            request.onerror = (e) => {
              console.warn("IndexedDB access denied/blocked. Falling back to storage fallback.", e?.target?.error);
              this.useFallback = true;
              resolve(this);
            };
          } catch (err) {
            console.warn("IndexedDB initialization exception:", err);
            this.useFallback = true;
            resolve(this);
          }
        });
      }

      // --- BOOKS ---

      async getAllBooks() {
        await this.ensureReady();
        if (this.useFallback || !this.db) {
          return this.fallbackGetAllBooks();
        }

        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('books', 'readonly');
            const store = tx.objectStore('books');
            const req = store.getAll();

            req.onsuccess = () => resolve(req.result || []);
            req.onerror = () => resolve(this.fallbackGetAllBooks());
          } catch (e) {
            resolve(this.fallbackGetAllBooks());
          }
        });
      }

      async getBook(id) {
        await this.ensureReady();
        if (this.useFallback || !this.db) {
          const books = this.fallbackGetAllBooks();
          return books.find(b => Number(b.id) === Number(id)) || null;
        }

        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('books', 'readonly');
            const store = tx.objectStore('books');
            const req = store.get(Number(id));

            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          } catch (e) {
            resolve(null);
          }
        });
      }

      async saveBook(book) {
        await this.ensureReady();
        if (!book.id) book.id = Date.now();

        if (this.useFallback || !this.db) {
          this.fallbackSaveBook(book);
          return book.id;
        }

        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('books', 'readwrite');
            const store = tx.objectStore('books');
            const req = store.put(book);

            req.onsuccess = () => resolve(book.id);
            req.onerror = () => {
              this.fallbackSaveBook(book);
              resolve(book.id);
            };
          } catch (e) {
            this.fallbackSaveBook(book);
            resolve(book.id);
          }
        });
      }

      async deleteBook(id) {
        await this.ensureReady();
        if (this.useFallback || !this.db) {
          this.fallbackDeleteBook(id);
          return;
        }

        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('books', 'readwrite');
            const store = tx.objectStore('books');
            const req = store.delete(Number(id));

            req.onsuccess = () => {
              this.fallbackDeleteBook(id);
              resolve();
            };
            req.onerror = () => resolve();
          } catch (e) {
            resolve();
          }
        });
      }

      fallbackGetAllBooks() {
        try {
          const index = JSON.parse(localStorage.getItem('lute_book_index') || '[]');
          const books = [];
          for (const id of index) {
            const item = localStorage.getItem(`lute_book_${id}`);
            if (item) books.push(JSON.parse(item));
          }
          return books.length > 0 ? books : this.memoryBooks;
        } catch(e) {
          return this.memoryBooks;
        }
      }

      fallbackSaveBook(book) {
        const idx = this.memoryBooks.findIndex(b => b.id === book.id);
        if (idx >= 0) this.memoryBooks[idx] = book;
        else this.memoryBooks.push(book);

        try {
          const index = JSON.parse(localStorage.getItem('lute_book_index') || '[]');
          if (!index.includes(book.id)) index.push(book.id);
          localStorage.setItem('lute_book_index', JSON.stringify(index));
          localStorage.setItem(`lute_book_${book.id}`, JSON.stringify(book));
        } catch(e) {}
      }

      fallbackDeleteBook(id) {
        this.memoryBooks = this.memoryBooks.filter(b => b.id !== Number(id));
        try {
          let index = JSON.parse(localStorage.getItem('lute_book_index') || '[]');
          index = index.filter(i => Number(i) !== Number(id));
          localStorage.setItem('lute_book_index', JSON.stringify(index));
          localStorage.removeItem(`lute_book_${id}`);
        } catch(e) {}
      }

      // --- WORDS ---

      async getAllWords() {
        await this.ensureReady();
        if (this.useFallback || !this.db) {
          try { return JSON.parse(localStorage.getItem('lute_words') || '{}'); } catch(e) { return this.memoryWords; }
        }

        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('words', 'readonly');
            const store = tx.objectStore('words');
            const req = store.getAll();

            req.onsuccess = () => {
              const map = {};
              (req.result || []).forEach(w => map[w.text] = w);
              resolve(map);
            };
            req.onerror = () => resolve({});
          } catch (e) {
            resolve({});
          }
        });
      }

      async saveWord(wordObj) {
        await this.ensureReady();
        this.memoryWords[wordObj.text] = wordObj;
        try {
          const words = JSON.parse(localStorage.getItem('lute_words') || '{}');
          words[wordObj.text] = wordObj;
          localStorage.setItem('lute_words', JSON.stringify(words));
        } catch(e) {}

        if (this.useFallback || !this.db) return;

        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('words', 'readwrite');
            const store = tx.objectStore('words');
            const req = store.put(wordObj);
            req.onsuccess = () => resolve();
            req.onerror = () => resolve();
          } catch (e) {
            resolve();
          }
        });
      }

      // --- SETTINGS ---

      async getSettings() {
        await this.ensureReady();
        const defaultSettings = {
          key: 'user_config',
          username: '',
          readerTheme: 'system',
          githubRepo: DEFAULT_GITHUB_REPO,
          enableSync: false,
          isLoggedIn: false,
          syncApiUrl: 'https://api.example.com/lute/sync'
        };

        try {
          const saved = localStorage.getItem('lute_settings');
          if (saved) return { ...defaultSettings, ...JSON.parse(saved) };
        } catch(e) {}

        if (this.useFallback || !this.db) return defaultSettings;

        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('settings', 'readonly');
            const req = tx.objectStore('settings').get('user_config');
            req.onsuccess = () => resolve(req.result ? { ...defaultSettings, ...req.result } : defaultSettings);
            req.onerror = () => resolve(defaultSettings);
          } catch (e) {
            resolve(defaultSettings);
          }
        });
      }

      async saveSettings(settings) {
        await this.ensureReady();
        try { localStorage.setItem('lute_settings', JSON.stringify(settings)); } catch(e) {}
        if (this.useFallback || !this.db) return;

        return new Promise((resolve) => {
          try {
            const tx = this.db.transaction('settings', 'readwrite');
            const req = tx.objectStore('settings').put({ key: 'user_config', ...settings });
            req.onsuccess = () => resolve();
            req.onerror = () => resolve();
          } catch (e) {
            resolve();
          }
        });
      }
    }

    const db = new LocalDB();

    const parseEPUBFile = async (file) => {
      if (!window.JSZip) throw new Error("JSZip not loaded");
      const zip = await window.JSZip.loadAsync(file);
      
      let textContent = "";
      const htmlFiles = Object.keys(zip.files).filter(fileName => 
        /\.(html|xhtml|htm)$/i.test(fileName)
      );

      for (const fileName of htmlFiles) {
        const rawHtml = await zip.file(fileName).async("string");
        const parser = new DOMParser();
        const doc = parser.parseFromString(rawHtml, 'text/html');
        doc.querySelectorAll('script, style').forEach(el => el.remove());
        const bodyText = doc.body ? doc.body.textContent : doc.documentElement.textContent;
        if (bodyText.trim().length > 0) {
          textContent += bodyText + "\n\n";
        }
      }
      return textContent.replace(/\s+/g, ' ').trim();
    };

    const chunkTextIntoPages = (fullText, wordsPerPage) => {
      if (!fullText) return [];
      const tokens = fullText.match(/[\w\u00C0-\u024F]+|[^\w\u00C0-\u024F]+/g) || [];
      
      const pages = [];
      let currentChunk = [];
      let wordCounter = 0;

      for (let token of tokens) {
        currentChunk.push(token);
        if (/[\w\u00C0-\u024F]/.test(token)) {
          wordCounter++;
        }

        if (wordCounter >= wordsPerPage) {
          pages.push(currentChunk.join(''));
          currentChunk = [];
          wordCounter = 0;
        }
      }

      if (currentChunk.length > 0) {
        pages.push(currentChunk.join(''));
      }

      return pages;
    };

    const { useState, useEffect, useRef, useMemo } = React;

    function useResolvedTheme(themeSetting) {
      const [systemIsDark, setSystemIsDark] = useState(
        window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
      );

      useEffect(() => {
        if (!window.matchMedia) return;
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        const handleChange = (e) => setSystemIsDark(e.matches);
        mediaQuery.addEventListener('change', handleChange);
        return () => mediaQuery.removeEventListener('change', handleChange);
      }, []);

      if (themeSetting === 'system') {
        return systemIsDark ? 'dark' : 'light';
      }
      return themeSetting || 'dark';
    }

    function getThemeStyles(theme) {
      if (theme === 'light') {
        return {
          bodyBg: 'bg-slate-100 text-slate-900',
          appBg: 'bg-slate-200',
          containerBg: 'bg-white border-slate-200',
          headerBg: 'bg-slate-50/90 border-slate-200 text-slate-800',
          navBg: 'bg-slate-50 border-slate-200',
          navActive: 'text-amber-600 bg-amber-100/80',
          navInactive: 'text-slate-500 hover:text-slate-800',
          cardBg: 'bg-slate-50 border-slate-200/80 text-slate-800',
          cardHover: 'hover:border-slate-300',
          textPrimary: 'text-slate-900',
          textMuted: 'text-slate-500',
          textSubtle: 'text-slate-400',
          inputBg: 'bg-white border-slate-200 text-slate-800 focus:border-amber-500',
          btnSecondary: 'bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-200',
          modalBg: 'bg-white/95 border-slate-200 text-slate-800',
          statusBadge: 'bg-slate-200 text-slate-700 border-slate-300',
        };
      }
      if (theme === 'sepia') {
        return {
          bodyBg: 'bg-amber-100 text-amber-950',
          appBg: 'bg-amber-200/60',
          containerBg: 'bg-[#fbf0d9] border-amber-200/80',
          headerBg: 'bg-[#f4e4c1]/90 border-amber-200/80 text-amber-950',
          navBg: 'bg-[#f4e4c1] border-amber-200/80',
          navActive: 'text-amber-900 bg-amber-200/70',
          navInactive: 'text-amber-800/60 hover:text-amber-950',
          cardBg: 'bg-[#f4e4c1]/60 border-amber-200/80 text-amber-950',
          cardHover: 'hover:border-amber-300',
          textPrimary: 'text-amber-950',
          textMuted: 'text-amber-800/70',
          textSubtle: 'text-amber-800/50',
          inputBg: 'bg-[#fbf0d9] border-amber-200 text-amber-950 focus:border-amber-600',
          btnSecondary: 'bg-amber-200/50 hover:bg-amber-200 text-amber-950 border border-amber-200',
          modalBg: 'bg-[#fbf0d9]/95 border-amber-200 text-amber-950',
          statusBadge: 'bg-amber-200/60 text-amber-900 border-amber-300/60',
        };
      }
      return {
        bodyBg: 'bg-zinc-950 text-zinc-100',
        appBg: 'bg-zinc-950',
        containerBg: 'bg-zinc-900 border-zinc-800',
        headerBg: 'bg-zinc-950/80 border-zinc-800 text-zinc-200',
        navBg: 'bg-zinc-950 border-zinc-800',
        navActive: 'text-amber-400 bg-zinc-800/60',
        navInactive: 'text-zinc-500 hover:text-zinc-300',
        cardBg: 'bg-zinc-950/60 border-zinc-800/80 text-zinc-200',
        cardHover: 'hover:border-zinc-700',
        textPrimary: 'text-zinc-100',
        textMuted: 'text-zinc-400',
        textSubtle: 'text-zinc-500',
        inputBg: 'bg-zinc-900 border-zinc-800 text-zinc-200 focus:border-amber-500',
        btnSecondary: 'bg-zinc-800 hover:bg-zinc-700 text-zinc-300',
        modalBg: 'bg-zinc-950/95 border-zinc-800 text-zinc-100',
        statusBadge: 'bg-zinc-800 text-zinc-400 border-zinc-700',
      };
    }

    function App() {
      const [currentScreen, setCurrentScreen] = useState('books');
      const [activeBookId, setActiveBookId] = useState(null);
      const [settings, setSettings] = useState(null);
      const [wordsDb, setWordsDb] = useState({});
      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      const activeThemeSetting = settings?.readerTheme || 'system';
      const effectiveTheme = useResolvedTheme(activeThemeSetting);
      const themeStyles = getThemeStyles(effectiveTheme);

      useEffect(() => {
        document.body.className = `min-h-screen overflow-hidden flex flex-col transition-colors duration-200 ${themeStyles.bodyBg}`;
      }, [effectiveTheme]);

      useEffect(() => {
        let isMounted = true;

        db.ensureReady()
          .then(async () => {
            if (!isMounted) return;
            try {
              const savedSettings = await db.getSettings();
              if (isMounted) setSettings(savedSettings);
              const savedWords = await db.getAllWords();
              if (isMounted) setWordsDb(savedWords);
            } catch (err) {
              console.warn("Error loading database content:", err);
            }
          })
          .catch((err) => {
            console.warn("Unhandled DB error safely caught:", err);
            if (isMounted) {
              setSettings({
                key: 'user_config',
                username: '',
                readerTheme: 'system',
                githubRepo: DEFAULT_GITHUB_REPO,
                enableSync: false,
                isLoggedIn: false,
                syncApiUrl: 'https://api.example.com/lute/sync'
              });
            }
          });

        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        const handleInstallPrompt = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };

        window.addEventListener('beforeinstallprompt', handleInstallPrompt);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);

        return () => {
          isMounted = false;
          window.removeEventListener('beforeinstallprompt', handleInstallPrompt);
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      const updateWordStatus = async (text, status, translation) => {
        const wordObj = { text: text.toLowerCase(), status, translation, updatedAt: new Date().toISOString() };
        const updated = { ...wordsDb, [wordObj.text]: wordObj };
        setWordsDb(updated);
        await db.saveWord(wordObj);
      };

      if (!settings) {
        return (
          <div className={`h-screen w-screen flex items-center justify-center font-mono text-xs ${themeStyles.bodyBg}`}>
            Loading Lute Reader...
          </div>
        );
      }

      return (
        <div className={`h-screen w-screen flex flex-col overflow-hidden transition-colors duration-200 ${themeStyles.appBg}`}>
          <main className="flex-1 relative overflow-hidden">
            {currentScreen === 'books' && (
              <BookListScreen 
                onOpenBook={(id) => { setActiveBookId(id); setCurrentScreen('reader'); }} 
                themeStyles={themeStyles}
              />
            )}
            
            {currentScreen === 'reader' && activeBookId && (
              <BookReaderScreen 
                bookId={activeBookId} 
                wordsDb={wordsDb} 
                onUpdateWord={updateWordStatus}
                settings={settings}
                onBack={() => {
                  setActiveBookId(null);
                  setCurrentScreen('books');
                }}
                themeStyles={themeStyles}
              />
            )}

            {currentScreen === 'settings' && (
              <SettingsScreen 
                settings={settings} 
                onSaveSettings={async (updated) => {
                  setSettings(updated);
                  await db.saveSettings(updated);
                }}
                deferredPrompt={deferredPrompt}
                onClearPrompt={() => setDeferredPrompt(null)}
                themeStyles={themeStyles}
              />
            )}
          </main>

          {currentScreen !== 'reader' && (
            <nav className={`h-14 border-t flex items-center justify-around z-20 px-2 transition-colors duration-200 ${themeStyles.navBg}`}>
              <button 
                onClick={() => setCurrentScreen('books')}
                className={`flex flex-col items-center gap-1 py-1 px-4 rounded-lg transition ${currentScreen === 'books' ? themeStyles.navActive : themeStyles.navInactive}`}
              >
                <i data-lucide="book-open" className="w-5 h-5"></i>
                <span className="text-[10px] font-medium">Library</span>
              </button>

              <button 
                onClick={() => setCurrentScreen('settings')}
                className={`flex flex-col items-center gap-1 py-1 px-4 rounded-lg transition ${currentScreen === 'settings' ? themeStyles.navActive : themeStyles.navInactive}`}
              >
                <i data-lucide="settings" className="w-5 h-5"></i>
                <span className="text-[10px] font-medium">Settings</span>
              </button>
            </nav>
          )}
        </div>
      );
    }

    function BookListScreen({ onOpenBook, themeStyles }) {
      const [books, setBooks] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [isUploading, setIsUploading] = useState(false);
      const fileInputRef = useRef(null);

      const loadBooks = async () => {
        setIsLoading(true);
        try {
          await db.ensureReady();
          const list = await db.getAllBooks();
          setBooks(list || []);
        } catch (err) {
          console.error("Error loading books:", err);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        loadBooks();
      }, []);

      useEffect(() => {
        const timer = setTimeout(() => {
          if (window.lucide && typeof window.lucide.createIcons === 'function') {
            window.lucide.createIcons();
          }
        }, 50);
        return () => clearTimeout(timer);
      }, [books, isLoading]);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setIsUploading(true);
        try {
          let content = "";
          const title = file.name.replace(/\.[^/.]+$/, "");

          if (file.name.endsWith('.epub')) {
            content = await parseEPUBFile(file);
          } else {
            content = await file.text();
          }

          if (!content.trim()) {
            alert("Unable to extract text from file.");
            setIsUploading(false);
            return;
          }

          const newBook = {
            id: Date.now(),
            title: title || "Untitled Book",
            content: content,
            currentPage: 0,
            addedAt: new Date().toISOString()
          };

          const id = await db.saveBook(newBook);
          await loadBooks();
          onOpenBook(id);
        } catch (err) {
          console.error(err);
          alert("Error parsing file: " + err.message);
        } finally {
          setIsUploading(false);
        }
      };

      const handleDeleteBook = async (e, id) => {
        e.stopPropagation();
        if (confirm("Delete this book from local storage?")) {
          await db.deleteBook(id);
          await loadBooks();
        }
      };

      return (
        <div className="h-full flex flex-col p-4 overflow-y-auto space-y-4">
          <div className={`flex items-center justify-between border-b pb-3 ${themeStyles.cardBg.includes('amber') ? 'border-amber-200' : themeStyles.cardBg.includes('slate') ? 'border-slate-200' : 'border-zinc-800'}`}>
            <div>
              <h2 className={`text-lg font-bold ${themeStyles.textPrimary}`}>Library</h2>
              <p className={`text-xs ${themeStyles.textMuted}`}>Offline database books</p>
            </div>
            
            <button 
              onClick={() => fileInputRef.current?.click()}
              disabled={isUploading}
              className="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-semibold px-3 py-1.5 rounded-lg text-xs transition"
            >
              <i data-lucide="upload" className="w-4 h-4"></i>
              <span>{isUploading ? 'Parsing...' : 'Upload'}</span>
            </button>
            <input 
              type="file" 
              ref={fileInputRef} 
              onChange={handleFileUpload} 
              accept=".txt,.epub,.md" 
              className="hidden" 
            />
          </div>

          {books.length === 0 ? (
            <div className={`flex-1 flex flex-col items-center justify-center text-center p-6 ${themeStyles.textMuted}`}>
              <i data-lucide="book-marked" className="w-12 h-12 stroke-1 mb-2"></i>
              <p className="text-sm">No books loaded in offline database.</p>
              <p className={`text-xs mt-1 ${themeStyles.textSubtle}`}>Upload `.epub` or `.txt` to start reading.</p>
            </div>
          ) : (
            <div className="grid grid-cols-1 gap-2.5">
              {books.map(b => (
                <div 
                  key={b.id}
                  onClick={() => onOpenBook(b.id)}
                  className={`p-3.5 border rounded-xl cursor-pointer flex items-center justify-between transition group ${themeStyles.cardBg} ${themeStyles.cardHover}`}
                >
                  <div className="flex-1 pr-3 min-w-0">
                    <h3 className={`font-medium text-sm truncate group-hover:text-amber-500 ${themeStyles.textPrimary}`}>{b.title}</h3>
                    <div className={`flex items-center gap-2 mt-1 text-[11px] ${themeStyles.textMuted}`}>
                      <span>{Math.round((b.content?.length || 0) / 5)} words</span>
                      <span>•</span>
                      <span>Page {(b.currentPage || 0) + 1}</span>
                    </div>
                  </div>

                  <button 
                    onClick={(e) => handleDeleteBook(e, b.id)}
                    className={`p-1.5 ${themeStyles.textMuted} hover:text-red-400 rounded-md transition`}
                    title="Delete book"
                  >
                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function BookReaderScreen({ bookId, wordsDb, onUpdateWord, settings, onBack, themeStyles }) {
      const [book, setBook] = useState(null);
      const [currentPage, setCurrentPage] = useState(0);
      const [selectedWord, setSelectedWord] = useState(null);
      const [customTranslation, setCustomTranslation] = useState('');
      const [popupPosition, setPopupPosition] = useState('bottom');
      const [showToolbar, setShowToolbar] = useState(false);
      const [fontSize, setFontSize] = useState(18);

      useEffect(() => {
        db.getBook(bookId).then(data => {
          if (data) {
            setBook(data);
            setCurrentPage(data.currentPage || 0);
          }
        });
      }, [bookId]);

      useEffect(() => {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }, [showToolbar, selectedWord]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (selectedWord) return;
          if (e.key === 'ArrowRight' || e.key === 'Space') {
            handleNextPage();
          } else if (e.key === 'ArrowLeft') {
            handlePrevPage();
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentPage, selectedWord]);

      const dynamicWordsPerPage = useMemo(() => {
        const baseSize = 18;
        const baseWords = 120;
        const scaleFactor = Math.pow(baseSize / fontSize, 2);
        return Math.max(25, Math.floor(baseWords * scaleFactor));
      }, [fontSize]);

      const pages = useMemo(() => {
        if (!book?.content) return [];
        return chunkTextIntoPages(book.content, dynamicWordsPerPage);
      }, [book?.content, dynamicWordsPerPage]);

      const saveProgress = async (newPageIdx) => {
        const safeIndex = Math.min(newPageIdx, pages.length - 1);
        setCurrentPage(safeIndex);
        if (book) {
          const updatedBook = { ...book, currentPage: safeIndex };
          setBook(updatedBook);
          await db.saveBook(updatedBook);
        }
      };

      const handleNextPage = () => {
        if (currentPage < pages.length - 1) saveProgress(currentPage + 1);
      };

      const handlePrevPage = () => {
        if (currentPage > 0) saveProgress(currentPage - 1);
      };

      const handleCanvasClick = (e) => {
        if (selectedWord) {
          setSelectedWord(null);
          return;
        }

        if (showToolbar) {
          setShowToolbar(false);
          return;
        }

        const rect = e.currentTarget.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;
        const width = rect.width;
        const height = rect.height;

        if (clickY < height * 0.2 || clickY > height * 0.8) {
          setShowToolbar(prev => !prev);
          return;
        }

        if (clickX < width * 0.35) {
          handlePrevPage();
        } else {
          handleNextPage();
        }
      };

      const handleWordClick = (e, wordText) => {
        e.stopPropagation();
        const normalized = wordText.toLowerCase();
        const existing = wordsDb[normalized] || { text: normalized, status: 1 };
        
        const wordRect = e.currentTarget.getBoundingClientRect();
        const isLowerHalf = wordRect.top > window.innerHeight / 2;
        setPopupPosition(isLowerHalf ? 'top' : 'bottom');

        setSelectedWord(existing);
        setCustomTranslation(existing.translation || '');
      };

      const handleSetWordStatus = (status) => {
        if (!selectedWord) return;
        onUpdateWord(selectedWord.text, status, customTranslation);
        setSelectedWord(null);
      };

      const openExternalDict = (service) => {
        if (!selectedWord) return;
        const word = encodeURIComponent(selectedWord.text);
        let url = '';
        switch (service) {
          case 'google':
            url = `https://translate.google.com/?sl=auto&tl=en&text=${word}`;
            break;
          case 'deepl':
            url = `https://www.deepl.com/translator#auto/en/${word}`;
            break;
          case 'wiktionary':
            url = `https://en.wiktionary.org/wiki/${word}`;
            break;
        }
        window.open(url, '_blank');
      };

      const renderFormattedPageText = (text) => {
        if (!text) return null;
        const tokens = text.match(/[\w\u00C0-\u024F]+|[^\w\u00C0-\u024F]+/g) || [];

        return tokens.map((token, idx) => {
          const isWord = /[\w\u00C0-\u024F]/.test(token);
          if (!isWord) {
            return <span key={idx}>{token}</span>;
          }

          const normalized = token.toLowerCase();
          const wordData = wordsDb[normalized];
          const statusClass = wordData?.status ? `word-status-${wordData.status}` : 'word-status-1';

          return (
            <span
              key={idx}
              onClick={(e) => handleWordClick(e, token)}
              className={`cursor-pointer rounded px-0.5 transition-colors ${statusClass}`}
            >
              {token}
            </span>
          );
        });
      };

      return (
        <div className="h-full flex flex-col relative select-none">
          {/* Header Controls */}
          {showToolbar && (
            <div className={`absolute top-0 left-0 right-0 z-30 p-3 flex items-center justify-between border-b backdrop-blur ${themeStyles.headerBg}`}>
              <button onClick={onBack} className="p-1.5 rounded-lg border flex items-center gap-1 text-xs">
                <i data-lucide="arrow-left" className="w-4 h-4"></i>
                <span>Library</span>
              </button>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setFontSize(prev => Math.max(12, prev - 2))} 
                  className="px-2 py-1 rounded border text-xs font-bold"
                >
                  A-
                </button>
                <span className="text-xs font-mono">{fontSize}px</span>
                <button 
                  onClick={() => setFontSize(prev => Math.min(32, prev + 2))} 
                  className="px-2 py-1 rounded border text-xs font-bold"
                >
                  A+
                </button>
              </div>
            </div>
          )}

          {/* Reading Canvas */}
          <div 
            onClick={handleCanvasClick}
            className="flex-1 p-6 overflow-hidden flex flex-col justify-between font-serif-reader leading-relaxed"
            style={{ fontSize: `${fontSize}px` }}
          >
            <div className="flex-1 overflow-hidden">
              {pages[currentPage] ? renderFormattedPageText(pages[currentPage]) : "Loading page..."}
            </div>

            {/* Bottom Footer Details */}
            <div className={`pt-4 mt-2 flex items-center justify-between text-xs border-t font-sans ${themeStyles.textMuted}`}>
              <span className="truncate max-w-[200px]">{book?.title}</span>
              <span>
                Page {currentPage + 1} of {pages.length || 1}
              </span>
            </div>
          </div>

          {/* Translation/Status Modal Popover */}
          {selectedWord && (
            <div className={`fixed left-4 right-4 z-40 p-4 rounded-xl border shadow-2xl backdrop-blur transition-all ${popupPosition === 'top' ? 'top-4' : 'bottom-4'} ${themeStyles.modalBg}`}>
              <div className="flex items-center justify-between border-b pb-2 mb-3">
                <h4 className="font-bold text-lg capitalize">{selectedWord.text}</h4>
                <div className="flex items-center gap-2">
                  <button onClick={() => openExternalDict('google')} className="text-xs px-2 py-1 border rounded">G-Trans</button>
                  <button onClick={() => openExternalDict('deepl')} className="text-xs px-2 py-1 border rounded">DeepL</button>
                  <button onClick={() => setSelectedWord(null)} className="p-1">
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              <input 
                type="text" 
                placeholder="Enter translation..." 
                value={customTranslation} 
                onChange={(e) => setCustomTranslation(e.target.value)} 
                className={`w-full p-2 mb-3 text-xs border rounded-lg ${themeStyles.inputBg}`}
              />

              <div className="grid grid-cols-5 gap-1.5">
                {[
                  { status: 1, label: '1 (New)' },
                  { status: 2, label: '2' },
                  { status: 3, label: '3' },
                  { status: 4, label: '4 (Well)' },
                  { status: 99, label: 'Ignore' },
                ].map((item) => (
                  <button
                    key={item.status}
                    onClick={() => handleSetWordStatus(item.status)}
                    className={`py-1.5 rounded text-xs font-semibold border ${selectedWord.status === item.status ? 'ring-2 ring-amber-500' : ''}`}
                  >
                    {item.label}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    function SettingsScreen({ settings, onSaveSettings, deferredPrompt, onClearPrompt, themeStyles }) {
      const [form, setForm] = useState(settings);
      const [labels, setLabels] = useState(() => {
        try { return JSON.parse(localStorage.getItem('lute_gh_labels')) || []; } catch(e) { return []; }
      });
      const [isFetchingLabels, setIsFetchingLabels] = useState(false);
      const [labelsError, setLabelsError] = useState(null);

      const fetchGithubLabels = async (repoName) => {
        if (!repoName || !repoName.includes('/')) return;
        setIsFetchingLabels(true);
        setLabelsError(null);
        try {
          const res = await fetch(`https://api.github.com/repos/${repoName}/labels`);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const fetchedLabels = data.map(l => ({ name: l.name, color: l.color, description: l.description }));
          setLabels(fetchedLabels);
          localStorage.setItem('lute_gh_labels', JSON.stringify(fetchedLabels));
        } catch (err) {
          setLabelsError("Failed to fetch labels: " + err.message);
        } finally {
          setIsFetchingLabels(false);
        }
      };

      useEffect(() => {
        if (form.githubRepo) {
          fetchGithubLabels(form.githubRepo);
        }
      }, []);

      const handleChange = (field, val) => {
        const updated = { ...form, [field]: val };
        setForm(updated);
        onSaveSettings(updated);
      };

      const handleInstallApp = async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          onClearPrompt();
        }
      };

      return (
        <div className="h-full p-4 overflow-y-auto space-y-6">
          <div className="border-b pb-3 flex items-center justify-between">
            <div>
              <h2 className={`text-lg font-bold ${themeStyles.textPrimary}`}>Settings</h2>
              <p className={`text-xs ${themeStyles.textMuted}`}>Reader & Display Preferences</p>
            </div>
            <span className="text-xs font-mono px-2 py-1 rounded bg-amber-500/10 text-amber-500 border border-amber-500/20 font-medium">
              {APP_VERSION}
            </span>
          </div>

          <div className="space-y-4">
            <div>
              <label className={`block text-xs font-medium mb-1 ${themeStyles.textMuted}`}>Theme</label>
              <select 
                value={form.readerTheme || 'system'} 
                onChange={(e) => handleChange('readerTheme', e.target.value)}
                className={`w-full p-2.5 text-xs rounded-xl border ${themeStyles.inputBg}`}
              >
                <option value="system">System Preference</option>
                <option value="dark">Dark Theme</option>
                <option value="light">Light Theme</option>
                <option value="sepia">Sepia Theme</option>
              </select>
            </div>

            <div>
              <div className="flex items-center justify-between mb-1">
                <label className={`block text-xs font-medium ${themeStyles.textMuted}`}>GitHub Repository</label>
                <button 
                  onClick={() => fetchGithubLabels(form.githubRepo)}
                  disabled={isFetchingLabels}
                  className="text-[11px] text-amber-500 hover:underline flex items-center gap-1"
                >
                  {isFetchingLabels ? 'Syncing...' : 'Sync Labels'}
                </button>
              </div>
              <input 
                type="text" 
                placeholder="owner/repository" 
                value={form.githubRepo || ''} 
                onChange={(e) => handleChange('githubRepo', e.target.value)} 
                className={`w-full p-2.5 text-xs rounded-xl border ${themeStyles.inputBg}`}
              />
            </div>

            {/* GitHub Labels Section */}
            <div className={`p-4 border rounded-xl space-y-2 ${themeStyles.cardBg}`}>
              <div className="flex items-center justify-between">
                <h4 className="text-xs font-bold">GitHub Labels</h4>
                <span className={`text-[10px] ${themeStyles.textSubtle}`}>{labels.length} synced</span>
              </div>

              {labelsError && <p className="text-[11px] text-red-400">{labelsError}</p>}

              {labels.length > 0 ? (
                <div className="flex flex-wrap gap-1.5 pt-1">
                  {labels.map(l => (
                    <span 
                      key={l.name} 
                      className="text-[10px] px-2 py-0.5 rounded-full font-medium"
                      style={{ 
                        backgroundColor: `#${l.color}25`, 
                        color: `#${l.color}`,
                        border: `1px solid #${l.color}50` 
                      }}
                      title={l.description || l.name}
                    >
                      {l.name}
                    </span>
                  ))}
                </div>
              ) : (
                <p className={`text-[11px] ${themeStyles.textMuted}`}>No labels synced. Enter repository path above.</p>
              )}
            </div>

            {deferredPrompt && (
              <div className={`p-4 border rounded-xl flex items-center justify-between ${themeStyles.cardBg}`}>
                <div>
                  <h4 className="text-xs font-bold">Install PWA</h4>
                  <p className={`text-[11px] ${themeStyles.textMuted}`}>Add app to your home screen for full offline usage</p>
                </div>
                <button 
                  onClick={handleInstallApp}
                  className="px-3 py-1.5 bg-amber-500 text-zinc-950 font-semibold text-xs rounded-lg"
                >
                  Install
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
